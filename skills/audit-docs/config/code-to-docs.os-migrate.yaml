      - requirements.txt
      - requirements.yml
    audience: external
    kind: feature

  - id: osm-upgrade
    doc: source/operator-upgrade.adoc
    code:
      - galaxy.yml
      - CHANGELOG.rst
    audience: external
    kind: feature

  - id: osm-walkthrough
    doc: source/operator-walkthrough.adoc
    code:
