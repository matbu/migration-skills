# Human-maintained map: os-migrate code -> documentation repo
product: os-migrate
code_repo: os-migrate
docs_repo: documentation

mappings:
  - id: osm-overview
    doc: source/operator-overview.adoc
    code:
      - README.md
      - galaxy.yml
    audience: external
    kind: feature
    status: partial
    notes: "Overview stub in documentation repo; fuller intro still on Sphinx site"

  - id: osm-install-galaxy
    doc: source/operator-install-from-galaxy.adoc
    code:
      - galaxy.yml
      - requirements.yml
    audience: external
    kind: feature

  - id: osm-install-source
    doc: source/operator-install-from-source.adoc
